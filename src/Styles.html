<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1f2328; --muted: #656d76; --line: #d8dee4;
    --accent: #2563eb; --accent-text: #ffffff; --warn-bg: #fff4e5; --warn-text: #8a4b00;
    --ok: #1a7f37; --bad: #cf222e; --chip: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --surface: #161b22; --text: #e6edf3; --muted: #8d96a0; --line: #30363d;
      --accent: #4c8dff; --accent-text: #0d1117; --warn-bg: #3a2a10; --warn-text: #f0c47a;
      --ok: #3fb950; --bad: #f85149; --chip: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .disclaimer { background: var(--warn-bg); color: var(--warn-text); padding: 8px 16px; font-size: 13px; text-align: center; font-weight: 600; }
  .topbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 18px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  select, input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); color: var(--muted); padding: 6px 10px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  .account { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .balance strong { font-size: 18px; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card.settled, .card.void { opacity: .75; }
  .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
  .card h3 { margin: 0; font-size: 15px; }
  .meta, .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .outcomes { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-top: 12px; }
  .outcome { display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 10px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); color: var(--text); cursor: pointer; font: inherit; }
  .outcome:hover:not([disabled]) { border-color: var(--accent); }
  .outcome[disabled] { cursor: default; opacity: .7; }
  .outcome.won { border-color: var(--ok); color: var(--ok); opacity: 1; }
  .outcome span { font-size: 13px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; font-weight: 600; }
  .badge.lab { background: var(--warn-bg); color: var(--warn-text); vertical-align: middle; }
  .s-open, .st-open { color: var(--accent); }
  .st-won { color: var(--ok); } .st-lost { color: var(--bad); }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .slip { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .slip-card { position: relative; width: 100%; max-width: 380px; background: var(--surface); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .slip-card label { justify-content: space-between; }
  .slip-card input { width: 140px; text-align: right; }
  .slip-market { color: var(--muted); font-size: 13px; padding-right: 24px; }
  .slip-outcome { font-weight: 700; font-size: 18px; }
  .close { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  .preview .row { display: flex; justify-content: space-between; font-size: 14px; padding: 2px 0; }
  .error { color: var(--bad); font-size: 13px; min-height: 1em; }
  .primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px; font: inherit; font-weight: 700; cursor: pointer; }
  .primary:disabled { opacity: .6; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
  /* admin */
  button { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { border: 0; }
  button.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  .muted { color: var(--muted); font-weight: 400; font-size: 12px; }
  .pos { color: var(--ok); } .neg { color: var(--bad); }
  .audit { margin-top: 4px; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); }
  .audit.ok { color: var(--ok); } .audit.bad { color: var(--bad); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .kpi-label { color: var(--muted); font-size: 12px; }
  .kpi-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  @media (max-width: 480px) { .grid.wide { grid-template-columns: 1fr; } }
  .admin-card { display: flex; flex-direction: column; gap: 8px; }
  .admin-card table { font-size: 12px; }
  .admin-card .table-wrap { border-radius: 8px; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; }
  tr.winner td { color: var(--ok); font-weight: 700; }
  td.wrap { white-space: normal; min-width: 220px; color: var(--muted); }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .form { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .form label { flex-direction: column; align-items: stretch; }
  .form .outcome-rows, .form .row-actions, .form .hint { grid-column: 1 / -1; }
  .outcome-row { display: grid; grid-template-columns: 1fr 1fr 130px; gap: 8px; margin-bottom: 6px; }
  .inline-form { display: inline-flex; gap: 6px; margin-top: 8px; }
  .inline-form input { width: 110px; }
  #newUser input { width: 220px; }
  input.setting { width: 110px; }

  .hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 16px; }
</style>
